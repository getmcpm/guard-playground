name: ci

# Pull requests and non-main pushes get the same two gates the Pages deploy
# runs — the engine drift guard and the test suite — without any deploy
# permission. pages.yml owns pushes to main.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run check:engine
      - run: npm test
